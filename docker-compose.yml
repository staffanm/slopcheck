# slopcheck -- static SPA and backend NLI service.
# Nginx proxies /api/ and /match to the backend service.
# Host reverse proxy maps slopcheck.tomtebo.org to port 8099.
services:
  slopcheck:
    build: .
    image: slopcheck:latest
    container_name: slopcheck
    restart: unless-stopped
    ports:
      - "8099:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    image: slopcheck-backend:latest
    container_name: slopcheck-backend
    restart: unless-stopped
    environment:
      - MODEL_NAME=BalaRajesh1/mmbert-small-nli
      - NUM_THREADS=2
    volumes:
      - hf-cache:/root/.cache/huggingface
    ports:
      - "127.0.0.1:8098:8000"

volumes:
  hf-cache:
