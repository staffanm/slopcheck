# slopcheck -- static SPA and backend NLI service.
# Nginx proxies /api/ and /match to the backend service.
# Host reverse proxy maps slopcheck.tomtebo.org to port 8099.
services:
  slopcheck:
    build: .
    image: slopcheck:latest
    container_name: slopcheck
    restart: unless-stopped
    ports:
      - "8099:80"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: slopcheck-backend:latest
    container_name: slopcheck-backend
    restart: unless-stopped
    environment:
      - MODEL_DIR=/app/models/classifier-kb-bert-4way-v5
      - NUM_THREADS=3
    volumes:
      - ./models/classifier-kb-bert-4way-v5:/app/models/classifier-kb-bert-4way-v5:ro
    ports:
      - "127.0.0.1:8098:8000"
